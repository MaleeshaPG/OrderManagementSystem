name: Auto Merge
 
on:

  push:

    branches:

      - development

      - qa
 
permissions:

  contents: write
 
jobs:

  merge-development:

    if: github.ref == 'refs/heads/development'

    runs-on: ubuntu-latest
 
    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0
 
      - run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"
 
          git fetch origin
 
          git checkout qa

          git merge origin/development --no-edit

          git push origin qa
 
  merge-main:

    if: github.ref == 'refs/heads/qa'

    runs-on: ubuntu-latest
 
    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0
 
      - run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"
 
          git fetch origin
 
          git checkout main

          git merge origin/qa --no-edit

          git push origin main
 
